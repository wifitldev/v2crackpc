name: build

on:
  workflow_call:
    inputs:
      target: # windows linux macos
        required: true
        type: string
      project:
        required: false
        type: string
        default: './v2rayN.Desktop/v2rayN.Desktop.csproj'

jobs:
  build:
    name: build x64 arm64
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: |-
      ${{
        case(
          inputs.target == 'macos', 'macos-latest',
          inputs.target == 'linux', 'ubuntu-24.04',
          inputs.target == 'windows', 'windows-latest',
          'ubuntu-latest'
        )
      }}
    env:
      Output: "${{ github.workspace }}/${{ matrix.arch }}"
      RID: |-
        ${{
          case(
            inputs.target == 'macos', format('osx-{0}', matrix.arch),
            inputs.target == 'windows', format('win-{0}', matrix.arch),
            format('{0}-{1}', inputs.target, matrix.arch)
          )
        }}
      Project: ${{ inputs.project }}
      ExtOpt: |-
        ${{
          case(
            inputs.target == 'windows', '-p:EnableWindowsTargeting=true',
            ''
          )
        }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Purge SDKs
      shell: pwsh
      run: |
        echo "Before:"
        dotnet --list-sdks
        
        dotnet --list-sdks | % {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
        }
        
        echo "After:"
        dotnet --list-sdks 2>$null; $LASTEXITCODE=0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.1xx
        
    - name: Build v2rayN
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish $Project -c Release -r $RID -p:SelfContained=true $ExtOpt -o $Output

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r $RID -p:SelfContained=true -p:PublishTrimmed=true $ExtOpt -o $Output

    - name: Add Linux runtime cores
      if: inputs.target == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        case "${{ matrix.arch }}" in
          x64) CORE_ARCH=64 ;;
          arm64) CORE_ARCH=arm64 ;;
          *) echo "Unsupported Linux architecture: ${{ matrix.arch }}"; exit 1 ;;
        esac
        tmp="$(mktemp -d)"
        curl -fL "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-linux-${CORE_ARCH}.zip" -o "$tmp/core.zip"
        unzip -q "$tmp/core.zip" -d "$tmp/core"
        if [[ -d "$tmp/core/bin" ]]; then
          cp -a "$tmp/core/bin/." "${{ matrix.arch }}/bin/"
        else
          mkdir -p "${{ matrix.arch }}/bin"
          cp -a "$tmp/core/." "${{ matrix.arch }}/bin/"
        fi
        rm -rf "$tmp"
        test -f "${{ matrix.arch }}/bin/xray/xray" -o -f "${{ matrix.arch }}/bin/xray"
        test -f "${{ matrix.arch }}/bin/sing_box/sing-box" -o -f "${{ matrix.arch }}/bin/sing-box"

    - name: Remove Debug Symbols
      shell: bash
      run: |
        find ${{ matrix.arch }} -type f -name '*.pdb' -delete

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.arch }}
        path: ${{ matrix.arch }}
